---
- name: Adopting Networker services to the RHOSO data plane
  hosts: rhoso_provisioning
  vars_files:
    - "/home/stack/ffu/variables.yaml"
  tasks:
    - name: Step0-1. Define the shell variable, part I
      ansible.builtin.template:
        src: network-vars.template.j2
        dest: "{{ networkers_env_vars_file }}"
      
    - name: Step1-1. Deploy the OpenStackDataPlaneNodeSet CR for your nodes, part I
      copy:
        owner: noiro
        group: noiro
        mode: '0777'
        dest: "{{ network_edpm_file }}"
        content: |
          source "{{ networkers_env_vars_file }}"
          oc apply -f - <<EOF
          apiVersion: dataplane.openstack.org/v1beta1
          kind: OpenStackDataPlaneNodeSet
          metadata:
            name: openstack-networker
          spec:
            tlsEnabled: false
            networkAttachments:
                - ctlplane
            preProvisioned: true
            services:
              - redhat
              - bootstrap
              - download-cache
              - configure-network
              - validate-network
              - install-os
              - configure-os
              - ssh-known-hosts
              - run-os
              - install-certs
              - cisco-opflex-agent-custom-service
              - neutron-opflex-agent-custom-service
            env:
              - name: ANSIBLE_CALLBACKS_ENABLED
                value: "profile_tasks"
              - name: ANSIBLE_FORCE_COLOR
                value: "True"
            nodes:
              controller-0:
                hostName: controller-0
                ansible:
                  ansibleHost: ${networkers[controller-0.localdomain]}
                networks:
                - defaultRoute: true
                  fixedIP: ${networkers[controller-0.localdomain]}
                  name: ctlplane
                  subnetName: subnet1
                - name: internalapi
                  subnetName: subnet1
                - name: storage
                  subnetName: subnet1
                - name: tenant
                  subnetName: subnet1
              controller-1:
                hostName: controller-1
                ansible:
                  ansibleHost: ${networkers[controller-1.localdomain]}
                networks:
                - defaultRoute: true
                  fixedIP: ${networkers[controller-1.localdomain]}
                  name: ctlplane
                  subnetName: subnet1
                - name: internalapi
                  subnetName: subnet1
                - name: storage
                  subnetName: subnet1
                - name: tenant
                  subnetName: subnet1
              controller-2:
                hostName: controller-2
                ansible:
                  ansibleHost: ${networkers[controller-2.localdomain]}
                networks:
                - defaultRoute: true
                  fixedIP: ${networkers[controller-2.localdomain]}
                  name: ctlplane
                  subnetName: subnet1
                - name: internalapi
                  subnetName: subnet1
                - name: storage
                  subnetName: subnet1
                - name: tenant
                  subnetName: subnet1
            nodeTemplate:
              ansibleSSHPrivateKeySecret: dataplane-adoption-secret
              ansible:
                ansibleUser: root
                ansibleVarsFrom:
                - secretRef:
                    name: subscription-manager
                - secretRef:
                    name: redhat-registry
                ansibleVars:
                  rhc_release: 9.2
                  rhc_repositories:
                      - {name: "*", state: disabled}
                      - {name: "rhel-9-for-x86_64-baseos-eus-rpms", state: enabled}
                      - {name: "rhel-9-for-x86_64-appstream-eus-rpms", state: enabled}
                      - {name: "rhel-9-for-x86_64-highavailability-eus-rpms", state: enabled}
                      - {name: "rhoso-18.0-for-rhel-9-x86_64-rpms", state: enabled}
                      - {name: "fast-datapath-for-rhel-9-x86_64-rpms", state: enabled}
                  edpm_bootstrap_release_version_package: []
                  # edpm_network_config
                  # Default nic config template for a EDPM node
                  # These vars are edpm_network_config role vars
                  edpm_network_config_template: |
                     ---
                     {% set mtu_list = [ctlplane_mtu] %}
                     {% for network in nodeset_networks %}
                     {{ mtu_list.append(lookup('vars', networks_lower[network] ~ '_mtu')) }}
                     {%- endfor %}
                     {% set min_viable_mtu = mtu_list | max %}
                     network_config:
                     - type: ovs_bridge
                       name: {{ neutron_physical_bridge_name }}
                       mtu: {{ min_viable_mtu }}
                       use_dhcp: false
                       dns_servers: {{ ctlplane_dns_nameservers }}
                       domain: {{ dns_search_domains }}
                       addresses:
                       - ip_netmask: {{ ctlplane_ip }}/{{ ctlplane_cidr }}
                       routes: {{ ctlplane_host_routes }}
                       members:
                       - type: interface
                         name: nic1
                         mtu: {{ min_viable_mtu }}
                         # force the MAC address of the bridge to this interface
                         primary: true
                     {% for network in nodeset_networks %}
                       - type: vlan
                         mtu: {{ lookup('vars', networks_lower[network] ~ '_mtu') }}
                         vlan_id: {{ lookup('vars', networks_lower[network] ~ '_vlan_id') }}
                         addresses:
                         - ip_netmask:
                             {{ lookup('vars', networks_lower[network] ~ '_ip') }}/{{ lookup('vars', networks_lower[network] ~ '_cidr') }}
                         routes: {{ lookup('vars', networks_lower[network] ~ '_host_routes') }}
                     {% endfor %}

                  edpm_network_config_hide_sensitive_logs: false
                  #
                  # These vars are for the network config templates themselves and are
                  # considered EDPM network defaults.
                  neutron_physical_bridge_name: br-dex
                  neutron_public_interface_name: eth0

                  # edpm_nodes_validation
                  edpm_nodes_validation_validate_controllers_icmp: false
                  edpm_nodes_validation_validate_gateway_icmp: false

                  # Comment out OVN stuff
                  # edpm ovn-controller configuration
                  #edpm_ovn_bridge_mappings: <bridge_mappings>
                  #edpm_ovn_bridge: br-int
                  #edpm_ovn_encap_type: geneve
                  #ovn_monitor_all: true
                  #edpm_ovn_remote_probe_interval: 60000
                  #edpm_ovn_ofctrl_wait_before_clear: 8000

                  # Comment out OVN stuff
                  # serve as a OVN gateway
                  #edpm_enable_chassis_gw: true

                  timesync_ntp_servers:
                  - hostname: clock.redhat.com
                  - hostname: clock2.redhat.com


                  gather_facts: false
                  enable_debug: false
                  # edpm firewall, change the allowed CIDR if needed
                  edpm_sshd_configure_firewall: true
                  edpm_sshd_allowed_ranges: ['192.168.122.0/24']
                  # SELinux module
                  edpm_selinux_mode: enforcing

                  # Do not attempt OVS major upgrades here
                  edpm_ovs_packages:
                  - openvswitch3.3
          EOF

    - name: Step1-2. Deploy the OpenStackDataPlaneNodeSet CR for your nodes, part II
      shell: "{{ network_edpm_file }}"

    - name: Step4-1. Optional Enable neutron-dhcp in the OpenStackDataPlaneNodeSet CR, part I
      copy:
        owner: noiro
        group: noiro
        mode: '0777'
        dest: "{{ deploy_edpm_ns_file }}"
        content: |
          oc patch openstackdataplanenodeset <networker_CR_name> --type='json' --patch= '[
          {
            "op": "add",
            "path": "/spec/services/-",
            "value": "neutron-dhcp"
          }]'

    - name: Step4-2. Optional Enable neutron-dhcp in the OpenStackDataPlaneNodeSet CR, part II
      shell: "{{ deploy_edpm_ns_file }}"

    - name: Step5-1. Run the pre-adoption-validation service for Networker nodes, part I
      copy:
        owner: noiro
        group: noiro
        mode: '0777'
        dest: "{{ pre_adopt_nn_validation_file }}"
        content: |
          oc apply -f - <<EOF
          apiVersion: dataplane.openstack.org/v1beta1
          kind: OpenStackDataPlaneDeployment
          metadata:
            name: openstack-pre-adoption-networker
          spec:
            nodeSets:
            - openstack-networker
            servicesOverride:
            - pre-adoption-validation
          EOF

    - name: Step5-1. Run the pre-adoption-validation service for Networker nodes, part I
      shell: "{{ pre_adopt_nn_validation_file }}"

    - name: Step5-3. Run the pre-adoption-validation service for Networker nodes, part III
      shell: oc get pod -l app=openstackansibleee

    - name: Step5-4. Run the pre-adoption-validation service for Networker nodes, part IV
      shell: oc logs -l app=openstackansibleee -f --max-log-requests 20

    - name: Step5-5. Run the pre-adoption-validation service for Networker nodes, part V
      shell: oc wait --for condition=Ready openstackdataplanedeployment/openstack-pre-adoption-networker --timeout=10m

    - name: Step6-1. Confirm that all the Ansible EE pods reach a Completed status, part I
      shell: oc get pod -l app=openstackansibleee

    - name: Step6-2. Confirm that all the Ansible EE pods reach a Completed status, part II
      shell: oc logs -l app=openstackansibleee -f --max-log-requests 20

    - name: Step7. Wait for the data plane node set to reach the Ready status
      shell: oc wait --for condition=Ready osdpns/<networker_CR_name> --timeout=30m

    - name: Step8. Verify that the Networking service (neutron) agents are running
      shell: oc exec openstackclient -- openstack network agent list
