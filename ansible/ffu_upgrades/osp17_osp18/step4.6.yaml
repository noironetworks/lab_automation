---
- name: Adopting the Image service that is deployed with a Object Storage service back end 
  hosts: rhoso_provisioning
  vars_files:
    - "/home/stack/ffu/variables.yaml"
  tasks:
    - name: Step1. Create a new file, for example, glance_swift.patch, and include the following content
      copy:
        owner: noiro
        group: noiro
        mode: '0777'
        dest: "{{ glance_patch_file }}"
        content: |
          spec:
            glance:
              enabled: true
              apiOverride:
                route: {}
              template:
                secret: osp-secret
                databaseInstance: openstack
                storage:
                  storageRequest: 10G
                customServiceConfig: |
                  [DEFAULT]
                  enabled_backends = default_backend:swift
                  [glance_store]
                  default_backend = default_backend
                  [default_backend]
                  swift_store_create_container_on_put = True
                  swift_store_auth_version = 3
                  swift_store_auth_address = {{"{{ .KeystoneInternalURL }}"}}
                  swift_store_endpoint_type = internalURL
                  swift_store_user = service:glance
                  swift_store_key = {{"{{ .ServicePassword }}"}}
                glanceAPIs:
                  default:
                    replicas: 1
                    override:
                      service:
                        internal:
                          metadata:
                            annotations:
                              metallb.universe.tf/address-pool: internalapi
                              metallb.universe.tf/allow-shared-ip: internalapi
                              metallb.universe.tf/loadBalancerIPs: 1.121.101.204
                          spec:
                            type: LoadBalancer
                    networkAttachments:
                      - storage
    - name: Step2. Verify that SwiftProxy is available
      shell: oc get pod -l component=swift-proxy | grep Running

    - name: Step3. Patch the GlanceAPI service that is deployed in the control plane
      shell: oc patch openstackcontrolplane openstack --type=merge --patch-file="{{ glance_patch_file }}"

    - name: Step6. Check that the service is active, and that the endpoints are updated in the RHOSP CLI
      shell: oc exec -t openstackclient -- openstack service list | grep image

    - name: Step6.5. Give time for CR
      ansible.builtin.pause:
        seconds: 60

    - name: Step7. Check that the images that you previously listed in the source cloud are available in the adopted service
      shell: oc exec -t openstackclient -- openstack image list
