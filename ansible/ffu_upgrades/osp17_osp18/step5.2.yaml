---
- name: Adopting Compute services to the RHOSO data plane
  hosts: rhoso_provisioning
  vars_files:
    - "/home/stack/ffu/variables.yaml"
  tasks:
    - name: Step0.2. You have defined the shell variables to run the script that runs the upgrade
      ansible.builtin.template:
        src: compute-vars.template.j2
        dest: "{{ adopt_compute_env_vars_file }}"

    - name: Step1.0-1. Create an SSH authentication secret for the data plane nodes, part I
      copy:
        owner: noiro
        group: noiro
        mode: '0777'
        dest: "{{ edpm_secrets_file }}"
        content: |
          oc apply -f - <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
              name: dataplane-adoption-secret
          data:
              ssh-privatekey: |
          $(cat "{{ provisioning_private_key_file }}"| base64 | sed 's/^/        /')
          EOF

    - name: Step1.0-2. Create an SSH authentication secret for the data plane nodes, part II
      shell: "{{ edpm_secrets_file }}"

    - name: Step3.0-1. If TLS Everywhere is enabled, set LIBVIRT_PASSWORD to match the existing RHOSP deployment password, part I
      ansible.builtin.copy:
        dest: "{{ libvirt_secrets_env_vars }}"
        owner: noiro
        group: noiro
        content: |
          declare -A TRIPLEO_PASSWORDS
          TRIPLEO_PASSWORDS[default]="{{ dst_overcloud_passwords_file }}"
          LIBVIRT_PASSWORD=$(cat ${TRIPLEO_PASSWORDS[default]} | grep ' LibvirtTLSPassword:' | awk -F ': ' '{ print $2; }')
          LIBVIRT_PASSWORD_BASE64=$(echo -n "$LIBVIRT_PASSWORD" | base64)

    - name: Step3.0-2. If TLS Everywhere is enabled, set LIBVIRT_PASSWORD to match the existing RHOSP deployment password, part II
      copy:
        owner: noiro
        group: noiro
        mode: '0777'
        dest: "{{ libvirt_secrets_file }}"
        content: |
          source "{{ libvirt_secrets_env_vars }}"
          oc apply -f - <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: libvirt-secret
          type: Opaque
          data:
            LibvirtPassword: ${LIBVIRT_PASSWORD_BASE64}
          EOF

    - name: Step3.0-3. If TLS Everywhere is enabled, set LIBVIRT_PASSWORD to match the existing RHOSP deployment password, part III
      shell: "{{ libvirt_secrets_file }}"

    - name: Step2.0-1. Generate an ssh key-pair nova-migration-ssh-key secret, part I
      copy:
        owner: noiro
        group: noiro
        mode: '0777'
        dest: "{{ nova_secrets_file }}"
        content: |
          cd "$(mktemp -d)"
          ssh-keygen -f ./id -t ecdsa-sha2-nistp521 -N ''
          oc get secret nova-migration-ssh-key || oc create secret generic nova-migration-ssh-key \
            --from-file=ssh-privatekey=id \
            --from-file=ssh-publickey=id.pub \
            --type kubernetes.io/ssh-auth
          rm -f id*
          cd -

    - name: Step2.0-2. Generate an ssh key-pair nova-migration-ssh-key secret, part II
      shell: "{{ nova_secrets_file }}"

    - name: Step4.0-1. Create a configuration map to use for all cells to configure a local storage back end for libvirt, part I
      copy:
        owner: noiro
        group: noiro
        mode: '0777'
        dest: "{{ libvirt_storage_file }}"
        content: |
          oc apply -f - <<EOF
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: nova-cells-global-config
          data:
            99-nova-compute-cells-workarounds.conf: |
              [workarounds]
              disable_compute_service_check_for_ffu=true
          EOF

    - name: Step4.0-2. Create a configuration map to use for all cells to configure a local storage back end for libvirt, part II
      shell: "{{ libvirt_storage_file }}"

    - name: Step6.0-1. Create the data plane services for Compute service cells to enable pre-upgrade workarounds, part I
      copy:
        owner: noiro
        group: noiro
        mode: '0777'
        dest: "{{ dp_services_file }}"
        content: |
          source "{{ adopt_compute_env_vars_file }}"
          for CELL in $(echo $RENAMED_CELLS); do
           oc apply -f - <<EOF
          ---
          apiVersion: dataplane.openstack.org/v1beta1
          kind: OpenStackDataPlaneService
          metadata:
            name: nova-$CELL
          spec:
            dataSources: 
              - secretRef:
                  name: nova-$CELL-compute-config 
              - secretRef:
                  name: nova-migration-ssh-key 
              - configMapRef:
                  name: nova-cells-global-config
            playbook: osp.edpm.nova
            caCerts: combined-ca-bundle
            edpmServiceType: nova
            containerImageFields:
            - NovaComputeImage
            - EdpmIscsidImage
          EOF
            done


    - name: Step6.0-2. Create the data plane services for Compute service cells to enable pre-upgrade workarounds, part II
      shell: "{{ dp_services_file }}"

    - name: Step6.9-1. Create the agent services, part I
      copy:
        owner: noiro
        group: noiro
        mode: '0777'
        dest: "{{ agent_services_file }}"
        content: |
          oc apply -f - <<EOF
          ---
          apiVersion: dataplane.openstack.org/v1beta1
          kind: OpenStackDataPlaneService
          metadata:
            name: ciscoaci-lldp-agent-service
          spec:
            label: dataplane-deployment-ciscoaci-lldp-agent-service
            openStackAnsibleEERunnerImage: 10.30.9.74:8787/osp18/combined-ansibleee-runner:18.0.9
            playbook: osp.edpm.lldp
            caCerts: combined-ca-bundle
            edpmServiceType: ciscoaci-lldp-agent-service
          ---
          apiVersion: dataplane.openstack.org/v1beta1
          kind: OpenStackDataPlaneService
          metadata:
            name: cisco-opflex-agent-custom-service
          spec:
            label: dataplane-deployment-cisco-opflex-agent-service
            openStackAnsibleEERunnerImage: 10.30.9.74:8787/osp18/combined-ansibleee-runner:18.0.9
            playbook: osp.edpm.opflex_agent
          ---
          apiVersion: dataplane.openstack.org/v1beta1
          kind: OpenStackDataPlaneService
          metadata:
            name: neutron-opflex-agent-custom-service
          spec:
            label: dataplane-deployment-neutron-opflex-agent-service
            openStackAnsibleEERunnerImage: 10.30.9.74:8787/osp18/combined-ansibleee-runner:18.0.9
            playbook: osp.edpm.neutron_opflex_agent
            caCerts: combined-ca-bundle
            edpmServiceType: neutron-opflex-agent-custom-service
            dataSources:
              - secretRef:
                  name: rabbitmq-transport-url-neutron-neutron-transport
          EOF

    - name: Step6.0-2. Create the agent services, part II
      shell: "{{ agent_services_file }}"

    - name: Step7. Create a secret for the subscription manager
      shell: oc create secret generic subscription-manager \
               --from-literal rhc_auth="{{ rhsm_data }}"

    - name: Step8.0-1. Create a secret for the Red Hat registry, part I
      copy:
        owner: noiro
        group: noiro
        mode: '0777'
        dest: "{{ registry_secret_file }}"
        content: |
          {% raw %}
          oc create secret generic redhat-registry --from-literal edpm_container_registry_logins='{"registry.redhat.io": {"mcohen2@cisco.com": "Ins3965!"}}'
          {% endraw %}

    - name: Step8.0-2. Create a secret for the Red Hat registry, part II
      shell: "{{ registry_secret_file }}"
      ignore_errors: yes

    - name: Step9.0-1. Create the data plane node set definitions for each cell, part I
      copy:
        owner: noiro
        group: noiro
        mode: '0777'
        dest: "{{ os_edpm_defs_file }}"
        content: |
          source "{{ adopt_compute_env_vars_file }}"
          declare -A names
          for CELL in $(echo $RENAMED_CELLS); do
            ref="COMPUTES_$(echo ${CELL}|tr '[:lower:]' '[:upper:]')"
            eval names=\${!${ref}[@]}
            ref_api="COMPUTES_API_$(echo ${CELL}|tr '[:lower:]' '[:upper:]')"
            [ -z "$names" ] && continue
            ind=0
            rm -f computes-$CELL
            for compute in $names; do
              ip="${ref}['$compute']"
              ip_api="${ref_api}['$compute']"
              cat >> computes-$CELL << EOF
              ${compute}:
                hostName: $compute
                ansible:
                  ansibleHost: ${!ip}
                networks:
                - defaultRoute: true
                  fixedIP: ${!ip}
                  name: ctlplane
                  subnetName: subnet1
                - name: internalapi
                  subnetName: subnet1
                  fixedIP: ${!ip_api}
                - name: storage
                  subnetName: subnet1
                - name: tenant
                  subnetName: subnet1
          EOF
              ind=$(( ind + 1 ))
            done
          
            test -f computes-$CELL || continue
            cat > nodeset-${CELL}.yaml <<EOF
          apiVersion: dataplane.openstack.org/v1beta1
          kind: OpenStackDataPlaneNodeSet
          metadata:
            name: openstack-$CELL
          spec:
            tlsEnabled: false
            networkAttachments:
                - ctlplane
            preProvisioned: true
            services:
              - redhat
              - bootstrap
              - download-cache
              - configure-network
              - validate-network
              - install-os
              - configure-os
              - ssh-known-hosts
              - run-os
              - reboot-os
              - install-certs
              - libvirt
              - nova-$CELL
              - cisco-opflex-agent-custom-service
              - neutron-opflex-agent-custom-service
            env:
              - name: ANSIBLE_CALLBACKS_ENABLED
                value: "profile_tasks, debug"
              - name: ANSIBLE_FORCE_COLOR
                value: "True"
              - name: ANSIBLE_VERBOSITY
                value: '4'
              - name: ANSIBLE_FORKS
                value: '1'
            nodeTemplate:
              ansibleSSHPrivateKeySecret: dataplane-adoption-secret
              ansible:
                ansibleUser: root
                ansibleVarsFrom:
                - secretRef:
                    name: subscription-manager
                - secretRef:
                    name: redhat-registry
                ansibleVars:
                  rhc_release: 9.2
                  rhc_repositories:
                      - {name: "*", state: disabled}
                      - {name: "rhel-9-for-x86_64-baseos-eus-rpms", state: enabled}
                      - {name: "rhel-9-for-x86_64-appstream-eus-rpms", state: enabled}
                      - {name: "rhel-9-for-x86_64-highavailability-eus-rpms", state: enabled}
                      - {name: "rhoso-18.0-for-rhel-9-x86_64-rpms", state: enabled}
                      - {name: "fast-datapath-for-rhel-9-x86_64-rpms", state: enabled}
                      - {name: "rhceph-7-tools-for-rhel-9-x86_64-rpms", state: enabled}
                  edpm_bootstrap_release_version_package: []
                  edpm_cisco_neutron_opflex_agent_container_registry_logins: ""
                  edpm_cisco_neutron_opflex_image: 10.30.9.74:8787/osp18/openstack-ciscoaci-neutron-opflex:18.0.9
                  edpm_cisco_opflex_agent_aci_apic_infravlan: 3914
                  edpm_cisco_opflex_agent_aci_apic_systemid: qa-fab-1
                  edpm_cisco_opflex_agent_aci_opflex_uplink_interface: bond1
                  edpm_cisco_opflex_image: 10.30.9.74:8787/osp18/openstack-ciscoaci-opflex:18.0.9
                  edpm_ciscoaci_lldp_image: 10.30.9.74:8787/osp18/openstack-ciscoaci-lldp:18.0.9
                  edpm_container_registry_insecure_registries:
                  - 10.30.9.74:8787
                  edpm_ciscoaci_lldp_interfaces: '*,!tap*'
                  # edpm_network_config
                  # Default nic config template for a EDPM node
                  # These vars are edpm_network_config role vars
                  {% raw %}
                  edpm_network_config_template: |
                     ---
                     {% set mtu_list = [ctlplane_mtu] %}
                     {% for network in nodeset_networks %}
                     {{ mtu_list.append(lookup('vars', networks_lower[network] ~ '_mtu')) }}
                     {%- endfor %}
                     {% set min_viable_mtu = mtu_list | max %}
                     network_config:
                     - type: interface
                       name: ens15f0
                       use_dhcp: false
                       dns_servers: {{ ctlplane_dns_nameservers }}
                       addresses:
                       - ip_netmask: {{ ctlplane_ip }}/{{ ctlplane_cidr }}
                       routes: {{ ctlplane_host_routes }}
                     - type: ovs_bridge
                       name: {{ neutron_physical_bridge_name }}
                       mtu: {{ min_viable_mtu }}
                       use_dhcp: false
                       members:
                       - type: linux_bond
                         name: bond1
                         use_dhcp: false
                         mtu: 8000
                         bonding_options: mode=802.3ad miimon=100 lacp_rate=slow xmit_hash_policy=layer2
                         members:
                         - type: interface
                           name: ens2f0
                           primary: true
                           mtu: 8000
                         - type: interface
                           name: ens2f1
                           mtu: 8000
                     {% for network in nodeset_networks %}
                       - type: vlan
                         device: bond1
                         mtu: {{ lookup('vars', networks_lower[network] ~ '_mtu') }}
                         vlan_id: {{ lookup('vars', networks_lower[network] ~ '_vlan_id') }}
                         addresses:
                         - ip_netmask:
                             {{ lookup('vars', networks_lower[network] ~ '_ip') }}/{{ lookup('vars', networks_lower[network] ~ '_cidr') }}
                         routes: {{ lookup('vars', networks_lower[network] ~ '_host_routes') }}
                     {% endfor %}
                  {% endraw %}

                  edpm_network_config_nmstate: false
                  # Control resolv.conf management by NetworkManager
                  # false = disable NetworkManager resolv.conf update (default)
                  # true = enable NetworkManager resolv.conf update
                  edpm_bootstrap_network_resolvconf_update: false
                  edpm_network_config_hide_sensitive_logs: false
                  #
                  # These vars are for the network config templates themselves and are
                  # considered EDPM network defaults.
                  neutron_physical_bridge_name: br-ex
                  neutron_public_interface_name: ens15f1

                  # edpm_nodes_validation
                  edpm_nodes_validation_validate_controllers_icmp: false
                  edpm_nodes_validation_validate_gateway_icmp: false

                  # edpm ovn-controller configuration
                  # Commented out - not needed in GBP with ACI deployment
                  #edpm_ovn_bridge_mappings: <bridge_mappings>  7
                  #edpm_ovn_bridge: br-int
                  #edpm_ovn_encap_type: geneve
                  #ovn_monitor_all: true
                  #edpm_ovn_remote_probe_interval: 60000
                  #edpm_ovn_ofctrl_wait_before_clear: 8000

                  timesync_ntp_servers:
                  - hostname: clock.redhat.com
                  - hostname: clock2.redhat.com

                  edpm_bootstrap_command: |
                    # FIXME: perform dnf upgrade for other packages in EDPM ansible
                    # here we only ensuring that decontainerized libvirt can start
                    dnf -y upgrade openstack-selinux
                    rm -f /run/virtlogd.pid

                  gather_facts: false
                  # edpm firewall, change the allowed CIDR if needed
                  edpm_sshd_configure_firewall: true
                  edpm_sshd_allowed_ranges: ['1.100.1.0/24']

                  # Do not attempt OVS major upgrades here
                  edpm_ovs_packages:
                  - openvswitch3.3
                  # Commented out - huge pages not used
                  #edpm_default_mounts:  8
                  #  - path: /dev/hugepages<size>
                  #    opts: pagesize=<size>
                  #    fstype: hugetlbfs
                  #    group: hugetlbfs
            nodes:
          EOF
            cat computes-$CELL >> nodeset-${CELL}.yaml
          done
          
    - name: Step9.0-2. Create the data plane node set definitions for each cell, part II
      shell: "{{ os_edpm_defs_file }}"

    - name: Step10.0-1. Deploy the OpenStackDataPlaneNodeSet CRs for each Compute cell, part I
      copy:
        owner: noiro
        group: noiro
        mode: '0777'
        dest: "{{ os_edpm_ns_file }}"
        content: |
          source "{{ prov_db_env_vars_file }}"
          for CELL in $(echo $RENAMED_CELLS); do
            test -f nodeset-${CELL}.yaml || continue
            oc apply -f nodeset-${CELL}.yaml
          done

    - name: Step10.0-2. Deploy the OpenStackDataPlaneNodeSet CRs for each Compute cell, part II
      shell: "{{ os_edpm_ns_file }}"

    - name: Step13.0-1. Optional Enable neutron-dhcp in the OpenStackDataPlaneNodeSet CR, part I
      copy:
        owner: noiro
        group: noiro
        mode: '0777'
        dest: "{{ os_edpm_dhcp_file }}"
        content: |
          source "{{ prov_db_env_vars_file }}"
          for CELL in $(echo $RENAMED_CELLS); do
          test -f nodeset-${CELL}.yaml || continue
          oc patch openstackdataplanenodeset openstack-$CELL --type='json' --patch='[
          {
            "op": "add",
            "path": "/spec/services/-",
            "value": "neutron-dhcp"
          }]'
          done

    - name: Step13.0-2. Optional Enable neutron-dhcp in the OpenStackDataPlaneNodeSet CR, part II
      shell: "{{ os_edpm_dhcp_file }}"

    - name: Step14.0-1. Optional Run the pre-adoption validation, part I
      copy:
        owner: noiro
        group: noiro
        mode: '0777'
        dest: "{{ preadopt_validation_1_file }}"
        content: |
          oc apply -f - <<EOF
          apiVersion: dataplane.openstack.org/v1beta1
          kind: OpenStackDataPlaneService
          metadata:
            name: pre-adoption-validation
          spec:
            playbook: osp.edpm.pre_adoption_validation
          EOF

    - name: Step14.0-2. Optional Run the pre-adoption validation, part II
      shell: "{{ preadopt_validation_1_file }}"

    - name: Step14.0-3. Optional Run the pre-adoption validation, part III
      copy:
        owner: noiro
        group: noiro
        mode: '0777'
        dest: "{{ preadopt_validation_2_file }}"
        content: |
          source "{{ adopt_compute_env_vars_file }}"
          oc apply -f - <<EOF
          apiVersion: dataplane.openstack.org/v1beta1
          kind: OpenStackDataPlaneDeployment
          metadata:
            name: openstack-pre-adoption
          spec:
            nodeSets: $NODESETS
            servicesOverride:
            - pre-adoption-validation
          EOF

    - name: Step14.0-4. Optional Run the pre-adoption validation, part IV
      shell: "{{ preadopt_validation_2_file }}"

    - name: Step14.0-5. Optional Run the pre-adoption validation, part V
      shell: oc get pod -l app=openstackansibleee

    - name: Step14.0-6. Optional Run the pre-adoption validation, part VI
      shell: oc logs -l app=openstackansibleee --max-log-requests 20

    - name: Step14.0-7. Optional Run the pre-adoption validation, part VII
      shell: oc wait --for condition=Ready openstackdataplanedeployment/openstack-pre-adoption --timeout=10m

    - name: Step15.0-1. Remove the remaining director services, part I
      copy:
        owner: noiro
        group: noiro
        mode: '0777'
        dest: "{{ remove_services_1_file }}"
        content: |
          oc apply -f - <<EOF
          apiVersion: dataplane.openstack.org/v1beta1
          kind: OpenStackDataPlaneService
          metadata:
            name: tripleo-cleanup
          spec:
            playbook: osp.edpm.tripleo_cleanup
          EOF

    - name: Step15.0-2. Remove the remaining director services, part II
      shell: "{{ remove_services_1_file }}"

    - name: Step15.0-3. Remove the remaining director services, part III
      copy:
        owner: noiro
        group: noiro
        mode: '0777'
        dest: "{{ remove_services_2_file }}"
        content: |
          source "{{ adopt_compute_env_vars_file }}"
          oc apply -f - <<EOF
          apiVersion: dataplane.openstack.org/v1beta1
          kind: OpenStackDataPlaneDeployment
          metadata:
            name: tripleo-cleanup
          spec:
            nodeSets: $NODESETS
            servicesOverride:
            - tripleo-cleanup
          EOF

    - name: Step15.0-4. Remove the remaining director services, part IV
      shell: "{{ remove_services_2_file }}"

    - name: Step16.0-1. When the clean-up is finished, deploy the OpenStackDataPlaneDeployment CR, part I
      copy:
        owner: noiro
        group: noiro
        mode: '0777'
        dest: "{{ os_dp_deployment_file }}"
        content: |
          source "{{ adopt_compute_env_vars_file }}"
          oc apply -f - <<EOF
          apiVersion: dataplane.openstack.org/v1beta1
          kind: OpenStackDataPlaneDeployment
          metadata:
            name: openstack
          spec:
            nodeSets: $NODESETS
          EOF

    - name: Step16.0-2. When the clean-up is finished, deploy the OpenStackDataPlaneDeployment CR, part II
      shell: "{{ os_dp_deployment_file }}"

    - name: Step16.0-3. When the clean-up is finished, deploy the OpenStackDataPlaneDeployment CR, part III
      ansible.builtin.pause:
        seconds: 30

    - name: Step17.0-1. Confirm that all the Ansible EE pods reach a Completed status, part I
      shell: oc get pod -l app=openstackansibleee

    - name: Step17.0-2. Confirm that all the Ansible EE pods reach a Completed status, part II
      shell: oc logs -l app=openstackansibleee --max-log-requests 20

    - name: Step18.0. Wait for the data plane node sets to reach the Ready status
      shell: source "{{ prov_db_env_vars_file }}" && for CELL in $(echo $RENAMED_CELLS); do oc wait --for condition=Ready osdpns/openstack-$CELL --timeout=30m; done

    - name: Step19. Verify that the Networking service (neutron) agents are running
      shell: oc exec openstackclient -- openstack network agent list
